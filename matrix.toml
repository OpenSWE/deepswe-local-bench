# Benchmark matrix: one [[server]] per ds4-server instance; every effort in
# `efforts` runs against that same instance (effort is a per-request field).
# Order = run order: Qwen Q2 first (fastest, validates the pipeline), DeepSeek Q4 last. A server whose model file is not on disk yet is waited for.

# `sessions` = resident server slots, `clients` = Pier's concurrent tasks. Keep them EQUAL.
# An agent re-sends its whole history each step, so one slot cannot hold three agents:
# they evict each other. Measured mid-sweep on Qwen Q2, 1 slot / 3 agents gave 2.4% median
# prefix reuse and ~60k tokens re-prefilled per step; 3 slots / 3 agents gave 97.2% and
# ~890 tokens. Re-measure per family with scripts/pick_concurrency.py, which is multi-turn
# for exactly this reason — a single-shot benchmark measures decode contention and lies.

[defaults]
ds4_repo = "~/github.com/antirez/ds4"
tasks = "~/github.com/datacurve-ai/deep-swe/tasks"
jobs_dir = "jobs"                        # relative to this repo, gitignored
port = 8000                              # ds4-server listens here, unprivileged
forward_port = 80                        # root-owned forwarder; squid allows only ports 80/443
base_url = "http://host.docker.internal/v1"
mini_swe_agent_version = "2.3.0"         # the leaderboard's pinned harness version
agent_timeout_multiplier = 2.0           # 3 h -> 6 h; aggregate.py also reports the 3 h cutoff
request_timeout_s = 1800  # litellm per-request cap; default 600s times out on long high-effort generations
verifier_timeout_multiplier = 3.0        # 30 min -> 90 min: task test suites run under Rosetta
                                         # emulation, several times slower than the native amd64
                                         # the leaderboard graded on. Does not touch agent behaviour.
max_retries = 1                          # Pier retries infra errors once; timeouts are never retried
seed = 0
kv_disk_dir = "/tmp/ds4-kv"
kv_disk_space_mb = 98304                 # 96 GiB. 32 GiB thrashed DeepSeek: every step stores a
                                         # fresh entry (198 MiB at 30k tokens, 323 MiB at 51k), so 3
                                         # concurrent trials exceed 32 GiB and the server logged 2818
                                         # evictions with hits=0 - evicted before any reuse. Prefill then
                                         # restarted at ctx=0 each step, ~7 min/step, timing out every
                                         # trial. Keep well under min_free_gb: 256 GiB once filled the
                                         # volume and killed the Docker VM.
min_free_gb = 150                        # driver clears the KV cache below this, refuses below it after
kv_cold_max_tokens = 200000
server_ready_timeout_s = 3600

# ---------------------------------------------------------------- Qwen3.8 Flash Next
# `max` needs ctx >= 393216; native ctx is 262144, so YaRN x2 extends it.
# The *-native rows are the control for the YaRN cost (high only).
[[server]]
id = "qwen3.8-flash-next-q2"
label = "Qwen3.8 Flash Next Q2"
family = "Qwen3.8 Flash Next"
quant = "Q2"
model = "gguf/Qwen3.8-Flash-Next-Q2.gguf"
ctx = 393216
sessions = 3
clients = 3
mtp = true
env = { DS4_QWEN4_YARN_FACTOR = "2" }
efforts = ["low", "medium", "high", "max"]

[[server]]
id = "qwen3.8-flash-next-q2-native"
label = "Qwen3.8 Flash Next Q2 (native ctx)"
family = "Qwen3.8 Flash Next"
quant = "Q2"
model = "gguf/Qwen3.8-Flash-Next-Q2.gguf"
ctx = 262144
sessions = 3
clients = 3
mtp = true
efforts = ["high"]

# ---------------------------------------------------------------- DeepSeek V4.1 Flash
# Dropped 2026-10-20: a newer DeepSeek release superseded V4.1 mid-sweep. Its partial
# jobs/ data stays on disk but is no longer aggregated.

[[server]]
id = "qwen3.8-flash-next-q4"
label = "Qwen3.8 Flash Next Q4"
